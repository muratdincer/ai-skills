name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog
        run: python3 scripts/catalog.py
      - name: Validate skills
        run: python3 scripts/sync.py --check
      - name: Generated files are up to date
        run: |
          python3 scripts/guide.py
          git diff --exit-code -- CATALOG.md CATALOG.tr.md GUIDE.md GUIDE.tr.md
      - name: Export smoke test
        run: |
          python3 scripts/export.py skills --lang tr --dest dist/skills
          python3 scripts/export.py bundle --role business-analyst --dest dist/ba.md
